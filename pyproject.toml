[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-image-upscaler"
version = "0.1.0"
description = "Local image and video upscaling CLI and web UI with Lanczos scaling and FFmpeg"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["Pillow>=12.3.0,<13", "Flask>=3.0,<4"]
keywords = ["image", "video", "upscale", "resize", "lanczos", "ffmpeg", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Conversion",
]

[project.urls]
Homepage = "https://github.com/mhazrla/image-upscaler"
Repository = "https://github.com/mhazrla/image-upscaler"
Issues = "https://github.com/mhazrla/image-upscaler/issues"

[project.scripts]
image-upscaler = "upscale:main"
image-upscaler-web = "web:main"

[tool.setuptools]
py-modules = ["upscale", "web"]
